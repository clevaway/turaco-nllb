[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turaco-nllb"
version = "0.1.0"
description = "Reproducible Turaco-NLLB English-Cameroon Pidgin training and evaluation"
requires-python = ">=3.10"
dependencies = [
  "transformers>=4.57,<5",
  "datasets>=4.4,<6",
  "accelerate>=1.10,<2",
  "sacrebleu>=2.5,<3",
  "sentencepiece>=0.2,<0.3",
  "protobuf>=4.25,<7",
  "sacremoses>=0.1,<0.2",
  "torch>=2.2",
  "pandas>=2.1",
  "pyarrow>=15",
  "PyYAML>=6",
  "tqdm>=4.66",
  "huggingface_hub>=0.34,<2",
]

[project.scripts]
turaco-train = "turaco_nllb.train:main"
turaco-evaluate = "turaco_nllb.evaluate:main"
turaco-translate = "turaco_nllb.translate:main"

[project.optional-dependencies]
lora = ["peft>=0.17,<1"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

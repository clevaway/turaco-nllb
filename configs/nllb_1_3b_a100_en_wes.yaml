run_name: Turaco-NLLB-1.3B-mt-en-wes
backend: nllb
base_model: facebook/nllb-200-distilled-1.3B
dataset_id: michsethowusu/english-cameroon-pidgin_sentence-pairs_mt560
output_dir: outputs/Turaco-NLLB-1.3B-mt-en-wes
directions: [en-wes]
seed: 42

data:
  validation_ratio: 0.05
  test_ratio: 0.05
  min_words: 2
  max_words: 220
  min_word_ratio: 0.35
  max_word_ratio: 3.0
  strip_reference_noise: true
  detokenize: true

tokenization:
  max_source_length: 192
  max_target_length: 224

tokenizer_extension:
  enabled: true
  vocab_size: 4000
  min_character_frequency: 3

training:
  mode: full
  epochs: 5
  learning_rate: 0.00002
  train_batch_size: 8
  eval_batch_size: 16
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  fp16: false
  bf16: true
  optimizer: adamw_torch_fused
  warmup_ratio: 0.05
  label_smoothing_factor: 0.1
  logging_steps: 25
  eval_steps: 200
  save_steps: 200
  save_total_limit: 2
  early_stopping_patience: 4

generation:
  batch_size: 32
  num_beams: 5
  max_new_tokens: 224
  length_penalty: 1.0
  no_repeat_ngram_size: 3
  repetition_penalty: 1.1
